# HAY Sale Report — fully-cloud daily run (v3.13)
#
# Runs on GitHub-hosted ubuntu-latest — no laptop needed. PDF export uses
# LibreOffice headless (pdf_libre.py) instead of Excel COM.
#
# NOTE: do NOT add actions/setup-python here — pdf_libre.py needs the
# SYSTEM python3 (the one python3-uno installs into).
#
# Required repository secret:
#   ENV_FILE = full contents of the local .env file
name: Daily Sale Report

on:
  schedule:
    # GitHub drops/delays crons on busy round-hour slots (the original
    # '0 23 * * *' never fired on 11-Jun-2026). Two staggered off-peak
    # crons: primary 22:43 UTC = 05:43 Bangkok, backup 23:27 UTC = 06:27
    # Bangkok. The guard job skips the backup when the primary already
    # ran, so recipients never get two emails.
    - cron: '43 22 * * *'
    - cron: '27 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date YYYY-MM-DD (leave blank = yesterday, Bangkok time)'
        required: false
        default: ''

# Never run two reports at the same time (e.g. manual + scheduled overlap)
concurrency:
  group: daily-report
  cancel-in-progress: false

# Least privilege: read repo (checkout) + read run history (backup guard).
permissions:
  contents: read
  actions: read

jobs:
  # Decide whether this trigger should produce a report. Manual runs and
  # the primary cron always run; the backup cron runs only if no other
  # scheduled run succeeded (or is still going) in the last 3 hours.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || \
             [ "${{ github.event.schedule }}" != "27 23 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SINCE=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=schedule&created=>${SINCE}" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})
                     | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                    | length")
          if [ "$N" -gt 0 ]; then
            echo "Primary scheduled run already handled today's report - skipping backup."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful primary run found - backup takes over."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install LibreOffice, Thai fonts, Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-calc python3-uno \
            fonts-tlwg-loma fonts-tlwg-garuda fonts-tlwg-kinnari \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation \
            python3-requests python3-dotenv

      # .env is gitignored — recreate it from the ENV_FILE repository secret
      # (Settings > Secrets and variables > Actions > New repository secret)
      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Run pipeline
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 daily_report.py --fetch-odoo --date "${{ inputs.date }}"
          else
            python3 daily_report.py --fetch-odoo
          fi

      - name: Upload PDFs as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-pdfs
          path: Daily PDFs/**
          if-no-files-found: ignore
          retention-days: 30
