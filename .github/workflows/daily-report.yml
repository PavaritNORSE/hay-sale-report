# HAY Sale Report — fully-cloud daily run (v3.13)
#
# Runs on GitHub-hosted ubuntu-latest — no laptop needed. PDF export uses
# LibreOffice headless (pdf_libre.py) instead of Excel COM.
#
# NOTE: do NOT add actions/setup-python here — pdf_libre.py needs the
# SYSTEM python3 (the one python3-uno installs into).
#
# PRIMARY TRIGGER: cron-job.org calls workflow_dispatch at 23:00 UTC (06:00 Bangkok).
#   See GITHUB_SETUP.md > "External Scheduler" for setup instructions.
#
# Required repository secret:
#   ENV_FILE = full contents of the local .env file
name: Daily Sale Report

on:
  schedule:
    # Emergency backup only — fires at 01:47 UTC = 08:47 Bangkok.
    # GitHub's scheduler is reliable at this low-traffic UTC hour.
    # Skipped automatically when cron-job.org already dispatched today.
    - cron: '47 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date YYYY-MM-DD (leave blank = yesterday, Bangkok time)'
        required: false
        default: ''
      recipients:
        description: 'Override EMAIL_TO (e.g. operation@norserepublic.com). Leave blank = use .env default.'
        required: false
        default: ''
      use_today:
        description: 'true = report for today (Bangkok time); leave blank = yesterday'
        required: false
        default: ''

# Each recipients-group runs independently so the 6 AM and noon jobs
# never block each other.
concurrency:
  group: daily-report-${{ inputs.recipients || 'default' }}
  cancel-in-progress: false

# Least privilege: read repo (checkout) + read run history (backup guard).
permissions:
  contents: read
  actions: read

jobs:
  # workflow_dispatch (from cron-job.org or manual) always runs.
  # The backup schedule runs only if no dispatch succeeded in the last 12 h.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?created=>${SINCE}" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})
                     | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")]
                    | length")
          if [ "$N" -gt 0 ]; then
            echo "Report already ran today - skipping backup schedule."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No run found in last 24 h - backup schedule takes over."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install LibreOffice, Thai fonts, Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-calc python3-uno \
            fonts-tlwg-loma fonts-tlwg-garuda fonts-tlwg-kinnari \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation \
            python3-requests python3-dotenv

      # .env is gitignored — recreate it from the ENV_FILE repository secret
      # (Settings > Secrets and variables > Actions > New repository secret)
      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          RECIPIENTS: ${{ inputs.recipients }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          if [ -n "$RECIPIENTS" ]; then
            sed -i "s|^EMAIL_TO=.*|EMAIL_TO=$RECIPIENTS|" .env
            sed -i "s|^EMAIL_CC=.*|EMAIL_CC=|" .env
          fi

      - name: Run pipeline
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 daily_report.py --fetch-odoo --date "${{ inputs.date }}"
          elif [ "${{ inputs.use_today }}" = "true" ]; then
            TODAY=$(TZ=Asia/Bangkok date +%Y-%m-%d)
            python3 daily_report.py --fetch-odoo --date "$TODAY"
          else
            python3 daily_report.py --fetch-odoo
          fi

      - name: Upload PDFs as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-pdfs
          path: Daily PDFs/**
          if-no-files-found: ignore
          retention-days: 30
